name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------
      # Python setup (required)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install libclang

      # -------------------------
      # libclang setup (system)
      # -------------------------
      - name: Install LLVM / libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libclang-dev

      - name: Install LLVM / libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - name: Install LLVM / libclang (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y

      # -------------------------
      # Configure CMake
      # -------------------------
      - name: Configure CMake
        run: cmake -B build -DAUGMENT_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      # -------------------------
      # Test
      # -------------------------
      - name: Run tests
        run: ctest --test-dir build --output-on-failure