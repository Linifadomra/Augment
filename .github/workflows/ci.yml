name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------
      # Python setup (required)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install libclang

      # -------------------------
      # libclang setup (system)
      # -------------------------
      - name: Install LLVM / libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libclang-dev libffi-dev

      - name: Install LLVM / libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          brew install libffi

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y

      # -------------------------
      # vcpkg (Windows)
      # -------------------------
      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install libffi:x64-windows

      # -------------------------
      # Configure (Windows)
      # -------------------------
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DAUGMENT_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      # -------------------------
      # Configure (Linux/macOS)
      # -------------------------
      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -B build
          -DAUGMENT_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      # -------------------------
      # Test
      # -------------------------
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}